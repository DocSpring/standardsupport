<!doctype html>
<!-- The link preview image (1200x630). Rendered to src/og.png by og/render: change this file, then run that. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: 'Bricolage Grotesque';
        src: url('../src/fonts/bricolage-grotesque.woff2') format('woff2');
        font-weight: 400 800;
      }
      @font-face {
        font-family: 'Atkinson Hyperlegible Next';
        src: url('../src/fonts/atkinson-hyperlegible-next.woff2') format('woff2');
        font-weight: 400 700;
      }
      :root {
        /* The site's dark theme. A link preview can't follow the viewer's theme, so there is one image. */
        --paper: oklch(20% 0.03 262);
        --ink: oklch(95% 0.012 255);
        --muted: oklch(76% 0.03 262);
        --accent: oklch(86% 0.16 90);
      }
      * {
        box-sizing: border-box;
        margin: 0;
      }
      body {
        width: 1200px;
        height: 630px;
        background: var(--paper);
        color: var(--ink);
        font-family: 'Bricolage Grotesque', sans-serif;
        padding: 84px 96px 0;
        position: relative;
        overflow: hidden;
      }
      .name {
        display: flex;
        align-items: center;
        gap: 28px;
        font-size: 84px;
        font-weight: 760;
        letter-spacing: -0.035em;
        line-height: 1;
      }
      .name svg {
        width: 124px;
        height: 124px;
        flex: none;
      }
      h1 {
        margin-top: 78px;
        font-size: 64px;
        font-weight: 740;
        letter-spacing: -0.03em;
        line-height: 1.1;
      }
      p {
        margin-top: 30px;
        font-family: 'Atkinson Hyperlegible Next', sans-serif;
        font-size: 31px;
        color: var(--muted);
      }
      .bar {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 26px;
        background: var(--accent);
      }
    </style>
  </head>
  <body>
    <div class="name">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" aria-hidden="true">
        <path fill="#ffcb3d" d="M4 6h24a2 2 0 0 1 2 2v5a3 3 0 0 0 0 6v5a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2v-5a3 3 0 0 0 0-6V8a2 2 0 0 1 2-2z" />
        <path stroke="#14213d" stroke-width="2.5" stroke-linecap="round" d="M10 13h12M10 19h8" />
      </svg>
      Standard Support
    </div>
    <h1>Let AI agents ask for help,<br />send feedback and open tickets.</h1>
    <p>A convention for MCP servers and APIs</p>
    <div class="bar"></div>
  </body>
</html>
